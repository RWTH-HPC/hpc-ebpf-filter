[package]
name = "hpc-ebpf-filter"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.5.60", features = ["derive"] }
env_logger = "0.11.9"
landlock = "0.4.5"
libbpf-rs = "0.26.1"
libbpf-sys = "1.6.3"
libc = "0.2.183"
log = "0.4.29"
nix = { version = "0.31.3", features = ["user"] }
skel-links-pin-macro = { path = "skel-links-pin-macro" }
strum = { version = "0.28.0", features = ["derive"] }
tokio = { version = "1.50.0", features = ["rt", "macros", "signal", "net"] }

[build-dependencies]
libbpf-cargo = "0.26.1"
serde_json = "1.0.149"
bindgen = "0.72.1"
strum = { version = "0.28.0", features = ["derive"] }
strum_macros = "0.28.0"
log = "0.4.29"

[profile.release]
lto = "thin"
opt-level = 3
strip = "debuginfo"
